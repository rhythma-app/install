<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install Rhythma</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #111113; --muted: #6b7280; --line: #e5e7eb; --code: #f6f7f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --fg: #f4f4f5; --muted: #9ca3af; --line: #26262a; --code: #151517; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; background: var(--bg); color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 48rem; text-align: center; }
  img { width: min(20rem, 80%); height: auto; }
  @media (prefers-color-scheme: dark) { img { filter: invert(1); } }
  .version { margin: 1rem 0 2rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  pre { margin: 0; padding: 1rem 1.25rem; text-align: left; white-space: pre-wrap; word-break: break-word; background: var(--code); border: 1px solid var(--line); border-radius: 0.75rem; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .hint { margin: 1rem 0 0; color: var(--muted); font-size: 0.875rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<main>
  <img src="rhythma-logo.png" alt="Rhythma" width="1485" height="308">
  <p class="version">Version 2026.09.0</p>
  <pre>curl -fsSL https://rhythma-app.github.io/install/install.sh | sh -s -- --key YOUR-KEY</pre>
  <p class="hint">Replace <code>YOUR-KEY</code> with your licence.</p>
</main>
